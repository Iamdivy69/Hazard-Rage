# Docker Compose template — Hazard Rage (Postgres + PostGIS + Redis)

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hazard-postgres
    environment:
      POSTGRES_USER: hazard
      POSTGRES_PASSWORD: hazard
      POSTGRES_DB: hazard_rage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazard"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hazard-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
